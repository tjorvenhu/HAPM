# HAPM lokal bauen und ausprobieren, auch unter Docker Desktop (Windows, macOS).
#
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Oberfläche: http://localhost:7080, HAProxy: http://localhost:8080 und https://localhost:8443
#
# Anders als im Betrieb läuft hier nichts im Netz des Hosts: HAProxy teilt sich
# das Netz mit dem HAPM-Container, und der veröffentlicht die Ports. Für die
# beiden Container ist das dasselbe Bild (127.0.0.1 erreicht den jeweils
# anderen). TCP-Weiterleitungen sind von außen nur auf den Ports erreichbar, die
# unten stehen.

name: hapm-dev

services:
  hapm:
    build:
      context: .
    image: hapm:dev
    container_name: hapm-dev
    restart: unless-stopped
    environment:
      PORT: "7080"
      TZ: Europe/Berlin
      HAPM_HAPROXY_CONTAINER: hapm-dev-haproxy
      HAPM_POSTGRES_CONTAINER: hapm-dev-postgres
    ports:
      - "7080:7080"
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data:/data
      - haproxy-etc:/etc/haproxy
      - haproxy-run:/run/haproxy
      - haproxy-log:/var/log/haproxy
      - acme:/root/.acme.sh
      - postgres-run:/var/run/postgresql
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:17-alpine
    container_name: hapm-dev-postgres
    restart: unless-stopped
    network_mode: none
    command: >-
      postgres -c listen_addresses='' -c shared_buffers=32MB -c max_connections=20
      -c max_worker_processes=4 -c max_parallel_workers=0 -c autovacuum_max_workers=1 -c jit=off
    environment:
      POSTGRES_DB: hapm
      POSTGRES_USER: hapm
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-run:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapm -d hapm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  haproxy:
    image: haproxy:lts
    container_name: hapm-dev-haproxy
    restart: unless-stopped
    network_mode: service:hapm
    user: root
    command: ["haproxy", "-f", "/etc/haproxy/haproxy.cfg", "-S", "/run/haproxy/master.sock"]
    depends_on:
      hapm:
        condition: service_healthy
    volumes:
      - haproxy-etc:/etc/haproxy:ro
      - haproxy-run:/run/haproxy

volumes:
  data:
  haproxy-etc:
  haproxy-run:
  haproxy-log:
  acme:
  postgres-data:
  postgres-run:
