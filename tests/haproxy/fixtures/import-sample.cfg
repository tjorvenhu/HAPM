# Ein HAProxy, das bisher von Hand gepflegt wurde.
global
    log /dev/log local0
    maxconn 4096
    lua-load /etc/haproxy/cors.lua
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

userlist admins
    user admin password $5$abc$def

frontend http_in
    bind *:80
    acl acme path_beg /.well-known/acme-challenge/
    redirect scheme https code 301 if !acme

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    # Websites
    acl host_shop hdr(host) -i shop.example.org www.shop.example.org:443
    acl host_blog req.hdr(Host),lower -m str blog.example.org
    acl host_wild hdr_end(host) -i .apps.example.org
    acl host_dom hdr_dom(host) -i kunde.example
    acl host_sni ssl_fc_sni -i sni.example.org
    acl host_old hdr(host) -i alt.example.org
    acl host_coolify hdr(host) -i coolify.example.org
    acl path_terminal path_beg /terminal/ws
    acl path_realtime path_beg /app
    acl host_lb hdr(host) -i lb.example.org
    acl host_multi hdr(host) -i a.example.org
    acl host_multi2 hdr(host) -i b.example.org
    acl host_admin hdr(host) -i admin.example.org
    acl office src 192.0.2.0/24
    acl host_dyn hdr_beg(host) -i dyn.
    acl host_dead hdr(host) -i dead.example.org

    http-request redirect location https://www.example.org code 301 if host_old
    http-request deny if host_admin !office

    use_backend coolify_terminal if host_coolify path_terminal
    use_backend coolify_realtime if host_coolify path_realtime
    use_backend coolify if host_coolify
    use_backend shop if host_shop
    use_backend blog if host_blog || host_sni
    use_backend apps if host_wild
    use_backend kunde if host_dom
    use_backend lb if host_lb
    use_backend multi if host_multi or host_multi2
    use_backend admin if host_admin
    use_backend dyn if host_dyn
    use_backend blog if host_dead
    use_backend shop if host_dead
    use_backend inline if { hdr(host) -i inline.example.org }

    default_backend fallback

backend shop
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    timeout tunnel 1h
    http-response set-header X-Frame-Options SAMEORIGIN
    http-request set-header X-Shop "eins zwei"
    server web1 10.0.0.11:8080 check
    server web2 10.0.0.12:8080 check

backend blog
    server blog 10.0.0.20:80

backend apps
    server apps 10.0.0.21:3000

backend kunde
    server kunde 10.0.0.22:80

backend coolify
    timeout tunnel 3600s
    server coolify 10.0.0.30:8000
backend coolify_terminal
    timeout tunnel 60m
    server coolify 10.0.0.30:6002
backend coolify_realtime
    timeout tunnel 1h
    server coolify 10.0.0.30:6001

# Lastverteilung mit Gewichten und Sitzungsbindung
backend lb
    balance leastconn
    cookie SRV insert indirect nocache
    server lb1 10.0.0.41:80 weight 3 cookie lb1
    server lb2 10.0.0.42:80 weight 1 cookie lb2

backend multi
    server m1 10.0.0.50:80 check # nur eine Verbindungsprüfung

backend admin
    server admin 10.0.0.60:80

backend dyn
    server dyn 10.0.0.61:80

backend inline
    server inline [2001:db8::10]:80

backend fallback
    http-request deny deny_status 404

backend unused
    server x 10.0.0.99:80

listen postgres
    bind :5432
    mode tcp
    option tcplog
    balance leastconn
    tcp-request connection reject if !{ src 10.0.0.0/8 192.0.2.10 }
    server db1 10.0.0.70:5432 check
    server db2 10.0.0.71:5432 check

frontend smtp_in
    mode tcp
    bind :2525
    default_backend smtp

backend smtp
    mode tcp
    server mail 10.0.0.80:25

frontend tls_passthrough
    mode tcp
    bind :8443
    tcp-request inspect-delay 5s
    use_backend sni_a if { req.ssl_sni -i a.example.org }
    default_backend sni_default

backend sni_a
    mode tcp
    server a 10.0.0.90:443

backend sni_default
    mode tcp
    server d 10.0.0.91:443

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /
