# HAPM: HAProxy mit Weboberfläche.
#
#   docker compose up -d
#
# Danach ist die Oberfläche unter http://<adresse-des-servers>:7080 erreichbar
# und fragt nach dem ersten Konto. HAProxy, die Grundkonfiguration und acme.sh
# richtet HAPM beim ersten Start selbst ein.
#
# HAPM und HAProxy laufen im Netz des Hosts. HAProxy braucht das für
# TCP-Weiterleitungen auf beliebigen Ports, HAPM für die ACME-Challenge
# (127.0.0.1:8888) und um zu sehen, welche Ports auf dem Server belegt sind.
# Das geht nur unter Linux. Postgres, die Datenbank von HAPM, hat gar kein Netz:
# HAPM erreicht es über einen Unix-Socket in einem geteilten Ordner.
#
# Alle Daten liegen in einem Ordner auf dem Server: HAPM_STORAGE, ohne Angabe
# `data` neben dieser Datei. Wer ihn sichert oder umzieht, hat alles.

name: hapm

services:
  hapm:
    image: ${HAPM_IMAGE:-ghcr.io/tjorvenhu/hapm:latest}
    container_name: hapm
    restart: unless-stopped
    network_mode: host
    environment:
      # Port der Oberfläche auf dem Server.
      PORT: ${HAPM_PORT:-7080}
      # Auf welcher Adresse sie lauscht. 127.0.0.1, sobald HAPM hinter dem eigenen HAProxy steht.
      HOSTNAME: ${HAPM_BIND:-0.0.0.0}
      TZ: ${TZ:-Europe/Berlin}
      # Zertifizierungsstelle. `letsencrypt_test` zum Ausprobieren ohne Kontingent.
      HAPM_ACME_SERVER: ${HAPM_ACME_SERVER:-letsencrypt}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${HAPM_STORAGE:-./data}/hapm:/data
      - ${HAPM_STORAGE:-./data}/haproxy:/etc/haproxy
      - ${HAPM_STORAGE:-./data}/run/haproxy:/run/haproxy
      - ${HAPM_STORAGE:-./data}/log:/var/log/haproxy
      - ${HAPM_STORAGE:-./data}/acme:/root/.acme.sh
      # Der Unix-Socket von Postgres. Darüber, und nur darüber, spricht HAPM mit der Datenbank.
      - ${HAPM_STORAGE:-./data}/run/postgres:/var/run/postgresql
      # Darüber prüft HAPM die Konfiguration im HAProxy-Container, liest dessen
      # Log und spielt Updates ein. Der Socket gibt vollen Zugriff auf Docker.
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    # Die Datenbank von HAPM: Konten, Sitzungen, Einstellungen, Protokoll, Statistik.
    # Die Hauptversion steht fest, kein `latest`: ein Sprung auf die nächste braucht
    # einen Umzug der Daten (pg_upgrade oder Sichern und Einspielen).
    image: postgres:17-alpine
    container_name: hapm-postgres
    restart: unless-stopped
    # Kein Netz. Postgres lauscht auf keinem Port (`listen_addresses=` leer),
    # sondern nur auf seinem Unix-Socket, und den teilt es über den Ordner
    # `run/postgres` mit HAPM.
    network_mode: none
    # Kleine Werte: ein Werkzeug mit einer Handvoll Benutzern und einer Zeile
    # Statistik je Minute und Abschnitt. HAPM hält höchstens fünf Verbindungen.
    command: >-
      postgres -c listen_addresses='' -c shared_buffers=32MB -c max_connections=20
      -c max_worker_processes=4 -c max_parallel_workers=0 -c autovacuum_max_workers=1 -c jit=off
    environment:
      POSTGRES_DB: hapm
      POSTGRES_USER: hapm
      # Kein Passwort: wer den Socket erreicht, ist HAPM. Von außen führt kein Weg
      # dorthin, es gibt keinen Port.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ${HAPM_STORAGE:-./data}/postgres:/var/lib/postgresql/data
      - ${HAPM_STORAGE:-./data}/run/postgres:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapm -d hapm"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  haproxy:
    # `lts` ist der aktuelle Langzeit-Zweig. HAPM meldet neue Abbilder und
    # spielt sie auf Klick oder selbsttätig ein.
    image: ${HAPROXY_IMAGE:-haproxy:lts}
    container_name: hapm-haproxy
    restart: unless-stopped
    network_mode: host
    # root, um die Ports 80 und 443 im Netz des Hosts zu binden. Die Arbeit
    # macht danach der Benutzer haproxy (siehe `user` in haproxy.cfg).
    user: root
    command: ["haproxy", "-f", "/etc/haproxy/haproxy.cfg", "-S", "/run/haproxy/master.sock"]
    depends_on:
      hapm:
        condition: service_healthy
    volumes:
      - ${HAPM_STORAGE:-./data}/haproxy:/etc/haproxy:ro
      - ${HAPM_STORAGE:-./data}/run/haproxy:/run/haproxy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
